name: Sync WhatsMeow Upstream

# Mescla tulir/whatsmeow na main deste fork, preservando o patch de botões (send.go).
# O whatsapp-api fixa um commit específico no go.mod, então nada chega em produção
# sem alguém atualizar o replace lá.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/tulir/whatsmeow.git
          git fetch upstream main

      - name: Merge upstream into main
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Já está atualizado com o upstream."
            exit 0
          fi

          git merge upstream/main --no-ff --no-commit || true

          # O GITHUB_TOKEN não pode alterar .github/workflows; mantemos os workflows deste fork.
          git restore --source=HEAD --staged --worktree -- .github

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "::error::Conflito ao mesclar o upstream (provavelmente no patch de botões). Merge manual necessário:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git commit --no-edit -m "Merge upstream/main"
          git push origin main
